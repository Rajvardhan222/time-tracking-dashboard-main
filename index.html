<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Manrope:wght@200..800&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Outfit:wght@100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Rubik:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">

    <title>Frontend Mentor | Time tracking dashboard</title>

    <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
    <style>
      .attribution {
        font-size: 0.6875rem;
        text-align: center;
      }
      .attribution a {
        color: hsl(228, 45%, 44%);
      }
    </style>
  </head>
  <body>
     
    

    <div class="main">
      <div class="profile">
        <div>
          <img src="./images/image-jeremy.png" alt="" id="avatar" />
          <div class="bio">
            <p>Report for</p>
            <p class="name"> Jeremy Robson</p>
          </div>
        </div>
        <div class="timeperiod">
          <p> Daily</p>
          <p class="active"> Weekly</p>
          <p> Monthly</p>
        </div>
      </div>
      <div class="work card">
        <div  class="info">
          <div>
            <p> Work</p>
            <img src="./images/icon-ellipsis.svg" alt="" />
          </div>
          <div>
            <p>5hrs</p>
            <p>Previous - 7hrs</p>
          </div>
        </div>
      </div>
      <div class="play card">
         <div class="info">
          <div>
            <p> Work</p>
            <img src="./images/icon-ellipsis.svg" alt="" />
          </div>
          <div>
            <p>5hrs</p>
            <p>Previous - 7hrs</p>
          </div>
        </div>
      </div>
      <div class="study card">
         <div class="info">
          <div>

          </div>
          <div>
            <p>5hrs</p>
            <p>Previous - 7hrs</p>
          </div>
        </div>
      </div>
      <div class="exercise card">
         <div class="info">
          <div>
            <p> Work</p>
            <img src="./images/icon-ellipsis.svg" alt="" />
          </div>
          <div>
            <p>5hrs</p>
            <p>Previous - 7hrs</p>
          </div>
        </div>
      </div>
      <div class="social card">
         <div class="info">
          <div>
            <p> Work</p>
            <img src="./images/icon-ellipsis.svg" alt="" />
          </div>
          <div>
            <p>5hrs</p>
            <p>Previous - 7hrs</p>
          </div>
        </div>
      </div>
      <div class="selfcare card">
        <div class="info">
          <div>
            <p> Work</p>
            <img src="./images/icon-ellipsis.svg" alt="" />
          </div>
          <div>
            <p>5hrs</p>
            <p>Previous - 7hrs</p>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
